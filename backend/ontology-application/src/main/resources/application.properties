server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5437/ontology-web-db
spring.datasource.username=dbuser
spring.datasource.password=dbpwd
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/db.changelog-ocp-master.xml
sirius.web.enabled=*

sirius.components.cors.allowedOriginPatterns=*
sirius.components.cors.allowedCredentials=true

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/Obeo-Enterprise-for-Sirius
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.client-id=Obeo-Enterprise-for-Sirius-api
spring.security.oauth2.client.registration.keycloak.client-secret=EqKcCb4HKkwgiQFem3IbEWy9NI1On1ub
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/Obeo-Enterprise-for-Sirius

ocp.
