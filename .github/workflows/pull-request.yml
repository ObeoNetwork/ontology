name: Pull Request Checks

on:
  pull_request:
    paths-ignore:
      - "CHANGELOG.adoc"
      - "README.adoc"
      - "doc/**"
    types:
      [
        opened,
        synchronize,
        reopened,
        labeled,
        unlabeled,
        milestoned,
        demilestoned,
      ]

permissions:
  contents: read

jobs:
  build:
    name: Metadata Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node SDK
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.20.0"
          registry-url: https://npm.pkg.github.com/
          scope: "@eclipse-sirius"

      - name: Check that the CHANGELOG has been updated
        env:
          GITHUB_EVENT: ${{ toJSON(github.event) }}
        run: node scripts/check-changelog.js

      - name: Check that the copyright of the modified files has been updated
        env:
          GITHUB_EVENT: ${{ toJSON(github.event) }}
        run: node scripts/check-copyright.js
